work_dir: ./work_dir/dhg/class28
# feeder
feeder: feeders.feeder_shrec17.Feeder
train_feeder_args:
  data_path: /APGCN/data/DHG14-28/
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 64
  random_rot: True
  p_interval: [0.5, 1]
  vel: True
  bone: True
  label_flag: 28

test_feeder_args:
  data_path: /APGCN/data/DHG14-28/
  split: test
  window_size: 64
  p_interval: [0.95]
  vel: True
  bone: True
  debug: False
  label_flag: 28

# model
model: model.APGCN.Model
model_args:
  num_class: 28
  num_point: 22
  num_person: 1
  pseudo_joints: 3
  graph: graph.shrec17.Graph
  graph_args:
    labeling_mode: 'virtual_ensemble'

#optim
weight_decay: 0.0004
base_lr: 0.1
lr_decay_rate: 0.1
step: [100, 130]
warm_up_epoch: 15

# training
device: [0]
batch_size: 32
test_batch_size: 32
num_epoch: 150
save_epoch: 150
nesterov: True
